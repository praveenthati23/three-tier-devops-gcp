<!DOCTYPE html>
<html>
<body>
<h2>Three Tier App</h2>
<button onclick="callApi()">Check Backend</button>

<script>
function callApi() {
  fetch("/api/health")
    .then(res => res.json())
    .then(data => alert(JSON.stringify(data)))
    .catch(err => alert("Backend not reachable"));
}
</script>
</body>
</html>
