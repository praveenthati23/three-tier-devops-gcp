name: CI-CD Dev to Staging

on:
  push:
    branches:
      - dev
      - staging

jobs:
  # =========================
  # DEV DEPLOYMENT
  # =========================
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- UI DEPLOY (UNCHANGED & WORKING) ----------
      - name: Deploy UI to DEV App VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_APP_HOST }}      # PUBLIC IP
          username: prawenkcumaar
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/prawenkcumaar/three-tier-devops-gcp
            git pull origin dev
            sudo systemctl reload nginx

      # ---------- BACKEND DEPLOY (VIA BASTION) ----------
      - name: Deploy Backend to DEV Backend VM (via App VM)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_APP_HOST }}      # PUBLIC IP (BASTION)
          username: prawenkcumaar
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          accept_host_keys: true
          script: |
            ssh prawenkcumaar@${{ secrets.DEV_BACKEND_HOST }} << 'EOF'
              cd /home/prawenkcumaar/three-tier-devops-gcp/backend
              git pull origin dev
              npm install --production
              sudo systemctl restart backend
            EOF


  # =========================
  # STAGING DEPLOYMENT
  # =========================
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging   # 👈 manual approval happens here

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- UI DEPLOY ----------
      - name: Deploy UI to STAGING App VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_APP_HOST }}   # PUBLIC IP
          username: prawenkcumaar
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/prawenkcumaar/three-tier-devops-gcp
            git pull origin staging
            sudo systemctl reload nginx

      # ---------- BACKEND DEPLOY (VIA BASTION) ----------
      - name: Deploy Backend to STAGING Backend VM (via App VM)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_APP_HOST }}   # PUBLIC IP (BASTION)
          username: prawenkcumaar
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ssh prawenkcumaar@${{ secrets.STAGING_BACKEND_PRIVATE_IP }} << 'EOF'
              cd /home/prawenkcumaar/three-tier-devops-gcp/backend
              git pull origin staging
              npm install --production
              sudo systemctl restart backend
            EOF
